<header class="header" role="banner">
  <div class="header-inner">
    <a class="header-brand" href="{{ "/" | relURL }}" aria-label="{{ .Site.Title }} - Home">
      {{ .Site.Title }}
    </a>

    <nav class="header-nav" role="navigation" aria-label="Main navigation">
      <ul class="header-nav-list">
        {{- range .Site.Menus.main -}}
        <li class="header-nav-item">
          <a class="header-nav-link" href="{{ .URL | relLangURL }}">{{ .Name }}</a>
        </li>
        {{- end -}}
      </ul>
    </nav>

    <div class="header-actions">
      <button class="header-search-toggle" aria-label="Search" aria-expanded="false" aria-controls="search-modal">
        <svg class="icon icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>

      {{- if .Site.Params.darkMode.enable -}}
      <button class="header-theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      {{- end -}}
    </div>
  </div>
</header>
