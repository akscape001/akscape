{{ define "main" }}
<div class="home" style="text-align: center; padding: var(--space-4xl) var(--space-lg);">
  <h1 style="font-size: 6rem; margin-bottom: var(--space-md); color: var(--color-fg-subtle);">404</h1>
  <h2 style="margin-bottom: var(--space-lg);">Page not found</h2>
  <p style="color: var(--color-fg-muted); margin-bottom: var(--space-2xl); max-width: 400px; margin-left: auto; margin-right: auto;">
    The page you're looking for doesn't exist or has been moved.
  </p>
  <a href="/" class="header-search-btn" style="width: auto; height: auto; padding: var(--space-md) var(--space-xl); font-family: var(--font-heading); font-size: 1rem; background: var(--color-accent); color: white; border-radius: var(--radius-md);">
    Return Home
  </a>
</div>
{{ end }}
