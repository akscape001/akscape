<script>
(function () {
  var html = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  var sunIcon = btn && btn.querySelector('.icon-sun');
  var moonIcon = btn && btn.querySelector('.icon-moon');

  function updateIcons() {
    var dark = html.dataset.theme === 'dark';
    if (sunIcon) sunIcon.style.display = dark ? 'none' : '';
    if (moonIcon) moonIcon.style.display = dark ? '' : 'none';
  }

  /* Sync icons with current theme (already applied by inline head script) */
  updateIcons();

  /* Toggle on click */
  if (btn) {
    btn.addEventListener('click', function () {
      var next = html.dataset.theme === 'dark' ? 'light' : 'dark';
      function apply() {
        html.dataset.theme = next;
        try { localStorage.setItem('theme', next); } catch (e) {}
        updateIcons();
      }
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!document.startViewTransition || reduce) { apply(); return; }
      /* Circular reveal of the new theme, growing from the toggle button */
      var r = btn.getBoundingClientRect();
      var x = r.left + r.width / 2, y = r.top + r.height / 2;
      var radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      html.classList.add('theme-switching');
      var vt = document.startViewTransition(apply);
      vt.ready.then(function () {
        html.animate(
          { clipPath: ['circle(0px at ' + x + 'px ' + y + 'px)', 'circle(' + radius + 'px at ' + x + 'px ' + y + 'px)'] },
          { duration: 450, easing: 'cubic-bezier(.4,0,.2,1)', pseudoElement: '::view-transition-new(root)' }
        );
      });
      vt.finished.finally(function () { html.classList.remove('theme-switching'); });
    });
  }

  /* Mobile nav sheet */
  var hamburger = document.getElementById('nav-hamburger');
  var navLinks  = document.getElementById('nav-links');
  var navInner  = navLinks ? navLinks.closest('.nav-inner') : null;
  var mobile    = window.matchMedia('(max-width: 768px)');

  function menuIsOpen() { return !!navLinks && navLinks.classList.contains('is-open'); }

  function setMenu(open, returnFocus) {
    if (!navLinks || !hamburger) return;
    navLinks.classList.toggle('is-open', open);
    hamburger.setAttribute('aria-expanded', String(open));
    /* .menu-open on <html> drives the scroll lock, on <body> drives the scrim */
    html.classList.toggle('menu-open', open);
    document.body.classList.toggle('menu-open', open);
    if (!open && returnFocus) hamburger.focus();
  }

  if (hamburger && navLinks) {
    hamburger.addEventListener('click', function () { setMenu(!menuIsOpen(), true); });

    /* A link inside the sheet navigates — close, but leave focus to the new page */
    navLinks.addEventListener('click', function (e) {
      if (e.target.closest('a')) setMenu(false, false);
    });

    /* Tap off the bar closes, and that tap is swallowed so it cannot activate the
       link beneath. Capture phase. The dialog guard keeps ⌘K search usable. */
    document.addEventListener('click', function (e) {
      if (!menuIsOpen() || document.querySelector('dialog[open]')) return;
      if (navInner && navInner.contains(e.target)) return;
      e.preventDefault();
      e.stopPropagation();
      setMenu(false, false);
    }, true);

    document.addEventListener('keydown', function (e) {
      if (!menuIsOpen() || document.querySelector('dialog[open]')) return;
      if (e.key === 'Escape') { setMenu(false, true); return; }
      if (e.key !== 'Tab' || !navInner) return;
      /* Focus trap over bar + sheet; the hamburger lives outside the <ul> */
      var items = navInner.querySelectorAll('a[href], button:not([disabled])');
      if (!items.length) return;
      var first = items[0], last = items[items.length - 1];
      if (!navInner.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    });

    /* Crossing to desktop closes the menu and clears every class */
    mobile.addEventListener('change', function (e) { if (!e.matches) setMenu(false, false); });
  }

  /* Article: reading progress + table-of-contents scroll-spy */
  var bar = document.getElementById('reading-progress-bar');
  var body = document.querySelector('.article-body');
  if (bar && body) {
    var onScroll = function () {
      var rect = body.getBoundingClientRect();
      var total = rect.height - window.innerHeight;
      var p = total > 0 ? Math.min(1, Math.max(0, -rect.top / total)) : 1;
      bar.style.transform = 'scaleX(' + p + ')';
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  var tocLinks = document.querySelectorAll('.toc-sidebar a[href^="#"]');
  if (tocLinks.length && 'IntersectionObserver' in window) {
    var byId = {};
    tocLinks.forEach(function (a) { byId[decodeURIComponent(a.hash.slice(1))] = a; });
    var current;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        var link = byId[en.target.id];
        if (!link) return;
        if (current) current.classList.remove('is-active');
        link.classList.add('is-active');
        current = link;
      });
    }, { rootMargin: '0px 0px -70% 0px' });
    Object.keys(byId).forEach(function (id) {
      var h = document.getElementById(id);
      if (h) io.observe(h);
    });
  }

  /* Copy button on code blocks */
  document.querySelectorAll('.article-body pre').forEach(function (pre) {
    if (!navigator.clipboard) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'code-copy';
    b.textContent = 'Copy';
    b.addEventListener('click', function () {
      var code = pre.querySelector('code') || pre;
      navigator.clipboard.writeText(code.innerText).then(function () {
        b.textContent = 'Copied';
        setTimeout(function () { b.textContent = 'Copy'; }, 1500);
      });
    });
    var wrap = pre.closest('.highlight') || pre;
    wrap.classList.add('has-copy');
    wrap.appendChild(b);
  });

  /* Sidenotes: on wide screens, show each footnote in the right margin beside its reference */
  var refs = document.querySelectorAll('.article-body sup[id^="fnref"] a[href^="#fn"]');
  if (refs.length) {
    var wide = window.matchMedia('(min-width: 1280px)');
    var notes = [];
    refs.forEach(function (a, i) {
      var li = document.getElementById(decodeURIComponent(a.hash.slice(1)));
      var block = a.closest('p, li, blockquote, table') || a.parentNode;
      if (!li || !block) return;
      var aside = document.createElement('aside');
      aside.className = 'sidenote';
      aside.setAttribute('role', 'note');
      var clone = li.cloneNode(true);
      clone.querySelectorAll('.footnote-backref').forEach(function (b) { b.remove(); });
      aside.innerHTML = '<span class="sidenote-num">' + (i + 1) + '</span>' + clone.innerHTML;
      block.parentNode.insertBefore(aside, block);
      notes.push(aside);
    });
    var syncNotes = function () { document.documentElement.classList.toggle('has-sidenotes', wide.matches && notes.length > 0); };
    wide.addEventListener('change', syncNotes);
    syncNotes();
  }

  /* Share: native share sheet on phones, otherwise copy the link */
  document.querySelectorAll('.share-copy').forEach(function (b) {
    var label = b.querySelector('.share-copy-label');
    var touch = navigator.share && window.matchMedia('(pointer: coarse)').matches;
    if (touch && label) label.textContent = 'Share';
    b.addEventListener('click', function () {
      if (touch) { navigator.share({ title: b.dataset.title, url: b.dataset.url }).catch(function () {}); return; }
      if (!navigator.clipboard) return;
      navigator.clipboard.writeText(b.dataset.url).then(function () {
        if (!label) return;
        label.textContent = 'Copied!';
        setTimeout(function () { label.textContent = 'Copy link'; }, 1500);
      });
    });
  });

  /* Topic filter: chips filter the post list in place; #topic=<tag> makes it shareable */
  var filter = document.querySelector('.topic-filter');
  var list = document.querySelector('.post-list');
  if (filter && list) {
    var chips = filter.querySelectorAll('[data-topic]');
    var applyTopic = function (topic) {
      chips.forEach(function (c) { c.setAttribute('aria-pressed', String(c.dataset.topic === topic)); });
      var shown = 0;
      list.querySelectorAll('.year-group').forEach(function (g) {
        var any = false;
        g.querySelectorAll('.article-list-item').forEach(function (row) {
          var match = !topic || (' ' + row.dataset.tags + ' ').indexOf(' ' + topic + ' ') !== -1;
          row.hidden = !match;
          if (match) any = true;
        });
        g.hidden = !any;
        if (any) shown++;
      });
      var empty = list.querySelector('.filter-empty');
      if (empty) empty.hidden = shown > 0;
    };
    chips.forEach(function (c) {
      c.addEventListener('click', function (e) {
        e.preventDefault();
        var topic = c.dataset.topic;
        applyTopic(topic);
        history.replaceState(null, '', topic ? '#topic=' + encodeURIComponent(topic) : location.pathname);
      });
    });
    var m = location.hash.match(/^#topic=(.+)$/);
    if (m) applyTopic(decodeURIComponent(m[1]));
  }
})();
</script>
