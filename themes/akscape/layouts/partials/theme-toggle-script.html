<script>
(function () {
  const html = document.documentElement;
  const btn = document.getElementById('theme-toggle');
  const sunIcon = btn && btn.querySelector('.icon-sun');
  const moonIcon = btn && btn.querySelector('.icon-moon');

  /* Apply saved or system preference immediately */
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = saved === 'dark' || (!saved && prefersDark);
  if (isDark) html.dataset.theme = 'dark';

  function updateIcons(dark) {
    if (!sunIcon || !moonIcon) return;
    sunIcon.style.display = dark ? 'none' : '';
    moonIcon.style.display = dark ? '' : 'none';
  }
  updateIcons(isDark);

  if (btn) {
    btn.addEventListener('click', function () {
      const nowDark = html.dataset.theme === 'dark';
      html.dataset.theme = nowDark ? 'light' : 'dark';
      localStorage.setItem('theme', html.dataset.theme);
      updateIcons(!nowDark);
    });
  }

  /* Mobile hamburger */
  const hamburger = document.getElementById('nav-hamburger');
  const navLinks = document.getElementById('nav-links');
  if (hamburger && navLinks) {
    hamburger.addEventListener('click', function () {
      const open = navLinks.classList.toggle('is-open');
      hamburger.setAttribute('aria-expanded', String(open));
    });
  }
})();
</script>
