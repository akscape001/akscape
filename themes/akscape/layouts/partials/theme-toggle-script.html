<script>
(function () {
  var html = document.documentElement;
  var btn = document.getElementById('theme-toggle');
  var sunIcon = btn && btn.querySelector('.icon-sun');
  var moonIcon = btn && btn.querySelector('.icon-moon');

  function updateIcons() {
    var dark = html.dataset.theme === 'dark';
    if (sunIcon) sunIcon.style.display = dark ? 'none' : '';
    if (moonIcon) moonIcon.style.display = dark ? '' : 'none';
  }

  /* Sync icons with current theme (already applied by inline head script) */
  updateIcons();

  /* Toggle on click */
  if (btn) {
    btn.addEventListener('click', function () {
      var nowDark = html.dataset.theme === 'dark';
      var next = nowDark ? 'light' : 'dark';
      html.dataset.theme = next;
      localStorage.setItem('theme', next);
      updateIcons();
    });
  }

  /* Mobile hamburger */
  var hamburger = document.getElementById('nav-hamburger');
  var navLinks = document.getElementById('nav-links');
  if (hamburger && navLinks) {
    hamburger.addEventListener('click', function () {
      var open = navLinks.classList.toggle('is-open');
      hamburger.setAttribute('aria-expanded', String(open));
    });
  }
})();
</script>
