{{/* ⌘K command palette — searches the Pagefind index built by `npm run build` */}}
<dialog class="palette" id="palette" aria-label="Search">
  <div class="palette-box">
    <div class="palette-input-row">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="palette-input" type="search" placeholder="Search posts…" autocomplete="off" spellcheck="false"
             role="combobox" aria-expanded="true" aria-controls="palette-results" aria-autocomplete="list">
      <kbd>esc</kbd>
    </div>
    <ul class="palette-results" id="palette-results" role="listbox"></ul>
    <p class="palette-status" id="palette-status" aria-live="polite"></p>
  </div>
</dialog>

<script>
(function () {
  var dlg = document.getElementById('palette');
  var input = document.getElementById('palette-input');
  var list = document.getElementById('palette-results');
  var status = document.getElementById('palette-status');
  if (!dlg || typeof dlg.showModal !== 'function') return;  // old browser: nav link goes to /search/

  var pagefind, active = -1;

  function load() {
    if (!pagefind) {
      pagefind = import('/pagefind/pagefind.js').catch(function () { return null; });
    }
    return pagefind;
  }

  function open() {
    if (dlg.open) return;
    dlg.showModal();
    input.select();
    load();
    if (!input.value) status.textContent = 'Type to search all posts';
  }

  function setActive(i) {
    var items = list.querySelectorAll('[role="option"]');
    if (!items.length) return;
    active = (i + items.length) % items.length;
    items.forEach(function (el, j) { el.setAttribute('aria-selected', String(j === active)); });
    items[active].scrollIntoView({ block: 'nearest' });
  }

  function render(results) {
    list.innerHTML = '';
    results.forEach(function (r, i) {
      var li = document.createElement('li');
      li.setAttribute('role', 'option');
      li.setAttribute('aria-selected', 'false');
      var a = document.createElement('a');
      a.href = r.url;
      var t = document.createElement('span');
      t.className = 'palette-title';
      t.textContent = (r.meta && r.meta.title) || r.url;
      var x = document.createElement('span');
      x.className = 'palette-excerpt';
      x.innerHTML = r.excerpt;  // Pagefind escapes content and adds <mark>
      a.appendChild(t); a.appendChild(x); li.appendChild(a);
      li.addEventListener('mousemove', function () { if (active !== i) setActive(i); });
      list.appendChild(li);
    });
    active = -1;
    if (results.length) setActive(0);
  }

  input.addEventListener('input', function () {
    var q = input.value.trim();
    if (!q) { render([]); status.textContent = 'Type to search all posts'; return; }
    load().then(function (pf) {
      if (!pf) { status.textContent = 'Search index not found — run npm run build to enable search.'; return null; }
      return pf.debouncedSearch(q, {}, 150);
    }).then(function (search) {
      if (!search) return;  // superseded by a newer keystroke, or no index
      return Promise.all(search.results.slice(0, 8).map(function (r) { return r.data(); })).then(function (data) {
        if (input.value.trim() !== q) return;
        render(data);
        status.textContent = data.length ? '' : 'No results for “' + q + '”';
      });
    });
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(active - 1); }
    else if (e.key === 'Enter') {
      var sel = list.querySelector('[aria-selected="true"] a');
      if (sel) { e.preventDefault(); window.location.href = sel.href; }
    }
  });

  // Click on the backdrop closes the dialog
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });

  var btn = document.getElementById('search-open');
  if (btn) btn.addEventListener('click', function (e) { e.preventDefault(); open(); });

  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if ((e.metaKey || e.ctrlKey) && k === 'k') { e.preventDefault(); dlg.open ? dlg.close() : open(); return; }
    if (k !== '/' || e.metaKey || e.ctrlKey || e.altKey || dlg.open) return;
    var t = e.target;
    if (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    e.preventDefault();
    open();
  });

  window.akscapeOpenSearch = open;
})();
</script>
