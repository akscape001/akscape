{{/* Email signup at the end of posts — shown when params.subscribe.buttondown is set */}}
{{ with site.Params.subscribe.buttondown }}
<aside class="subscribe" aria-label="Follow new posts">
  <p class="subscribe-title">Get new posts by email</p>
  {{ partial "subscribe-form.html" . }}
  <p class="subscribe-note">No spam. Unsubscribe anytime.</p>
</aside>
{{ end }}
