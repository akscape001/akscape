{{/* Share links — plain URLs, no third-party scripts. Context: a regular page. */}}
{{- $url := .Permalink | urlquery -}}
{{- $title := .Title | urlquery -}}

  <span class="share-label">Share</span>

  <a class="share-link" href="https://www.reddit.com/submit?url={{ $url }}&title={{ $title }}" target="_blank" rel="noopener noreferrer" aria-label="Share on Reddit">
