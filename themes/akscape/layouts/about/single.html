{{ define "main" }}
<div class="page about-page" data-pagefind-body>
    <h1 class="about-title" data-pagefind-meta="title">{{ .Title }}</h1>

    <section class="about-section" id="story">
      <p class="about-section-title">Story</p>
      <div class="about-body">
        {{ with .Params.story }}
          {{ . | markdownify }}
        {{ else }}
          {{ .Content }}
        {{ end }}
      </div>
    </section>

    {{ with .Params.disclaimer }}
    <aside class="disclaimer" aria-label="Disclaimer">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
      </svg>
      <div>{{ . | markdownify }}</div>
    </aside>
    {{ end }}
</div>
{{ end }}
