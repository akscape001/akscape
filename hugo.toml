baseURL = "https://akscape.com/"
defaultContentLanguage = "en"
title = "akscape"
theme = "akscape"
enableRobotsTXT = true
enableGitInfo = true
paginate = 10
copyright = "Arun Kumar Venkitaraman"

[params]
  author       = "Arun Kumar Venkitaraman"
  description  = "A knowledge website covering computer science, mathematics, AI, philosophy and more."
  githubURL    = "https://github.com/arunkumarvenkitaraman"
  linkedinURL  = "https://linkedin.com/in/arunkumarvenkitaraman"
  email        = "hello@akscape.com"
  rssURL       = "/index.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style          = "github"
    lineNos        = false
    noClasses      = false
    codeFences     = true
    guessSyntax    = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
    ordered    = false

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page    = ["HTML"]

[taxonomies]
  tag      = "tags"
  category = "categories"

