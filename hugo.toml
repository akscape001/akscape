baseURL = "https://www.akscape.com/"
defaultContentLanguage = "en"
title = "akscape"
theme = "akscape"
enableRobotsTXT = true
enableGitInfo = true
paginate = 10
copyright = "Arun Kumar Venkitaraman"

[params]
  author       = "Arun Kumar Venkitaraman"
  description  = "Exploring ideas beyond intuition."
  ogImage      = "/og-default.png"
  githubURL    = "https://github.com/akscape001"
  linkedinURL  = "https://www.linkedin.com/in/arunkumar0509"
  email        = "arunkv.official@gmail.com"
  # Cloudflare Web Analytics token (dashboard → Analytics & Logs → Web Analytics). Empty = off.
  cloudflareAnalyticsToken = "33f4698a6df64b97b38a8d5a126bf8f3"

  # Follow new posts. buttondown = your Buttondown username (enables the email form at the end of posts). Empty = RSS link only.
  [params.subscribe]
    buttondown = ""

  # How lists adapt as the site grows (home, section hubs, archive)
  [params.listing]
    latestCount  = 8    # posts shown under "Latest" on the home page
    startHereMin = 8    # show "Start here" (featured: true posts) once a list has more posts than this
    topicsMin    = 2    # show topic filter once this many tags each have 2+ posts
    compactAfter = 20   # lists longer than this hide descriptions

# A lastmod in front matter wins over the git commit date (useful for imported posts)
[frontmatter]
  lastmod = ["lastmod", ":git", ":fileModTime", "date"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    # Leave LaTeX untouched by Markdown so KaTeX sees it verbatim
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block  = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    style          = "github"
    lineNos        = false
    noClasses      = false
    codeFences     = true
    guessSyntax    = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
    ordered    = false

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page    = ["HTML"]

[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"

# "Keep reading" matches posts on shared tags/series, newer or older
[related]
  includeNewer = true
  threshold    = 1
  toLower      = true
  [[related.indices]]
    name   = "series"
    weight = 100
  [[related.indices]]
    name   = "tags"
    weight = 80
