baseURL = "https://akscape.com/"
defaultContentLanguage = "en"
title = "akscape"
theme = "akscape"
enableRobotsTXT = true
enableGitInfo = true
paginate = 10
copyright = "Arun Kumar Venkitaraman"

[params]
  author       = "Arun Kumar Venkitaraman"
  description  = "Exploring ideas beyond intuition."
  ogImage      = "/og-default.png"
  linkedinURL  = "https://linkedin.com/in/arunkumarvenkitaraman"
  email        = "arunkv.official@gmail.com"
  rssURL       = "/index.xml"

# A lastmod in front matter wins over the git commit date (useful for imported posts)
[frontmatter]
  lastmod = ["lastmod", ":git", ":fileModTime", "date"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    # Leave LaTeX untouched by Markdown so KaTeX sees it verbatim
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block  = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    style          = "github"
    lineNos        = false
    noClasses      = false
    codeFences     = true
    guessSyntax    = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 4
    ordered    = false

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page    = ["HTML"]

[taxonomies]
  tag      = "tags"
  category = "categories"
