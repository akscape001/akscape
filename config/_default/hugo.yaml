baseURL: 'https://akscape.com/'
title: 'akscape'
languageCode: 'en-us'
defaultContentLanguage: 'en'
enableRobotsTXT: true
enableGitInfo: true
build:
  writeStats: true
  useResourceCacheWhen: 'fallback'

# Taxonomies
taxonomies:
  tag: 'tags'

# Output formats
outputs:
  home: ['HTML', 'RSS', 'JSON']
  page: ['HTML']
  section: ['HTML', 'RSS']
  tag: ['HTML', 'RSS']

# Imaging
imaging:
  resampleFilter: 'Lanczos'
  quality: 85
  anchor: 'smart'

# Markup configuration
markup:
  goldmark:
    renderer:
      unsafe: true
      hardWraps: false
      xHTML: false
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['$$', '$$']
            - ['\\[', '\\]']
          inline:
            - ['$', '$']
            - ['\\(', '\\)']
  highlight:
    style: 'github-dark'
    lineNos: true
    lineNumbersInTable: true
    guessSyntax: true
    hl_Lines: ''
    noClasses: false
    tabWidth: 4
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false
  linkify: true
  typographer: true

# Privacy
privacy:
  youtube:
    privacyEnhanced: true
  vimeo:
    privacyEnhanced: true

# Sitemap
sitemap:
  changefreq: 'weekly'
  priority: 0.5
  filename: 'sitemap.xml'

# Minify
minify:
  disableXML: false
  minifyOutput: true
  tdewolff:
    html:
      keepWhitespace: false
      keepEndTags: false
      keepDocumentTags: false
      keepDefaultAttrVals: false
    css:
      keepCSS2: false
    js:
      keepES5: false
      keepES6: false